name: Update PROD ENV on Server

on:
  workflow_dispatch: # allows manual trigger

jobs:
  write-prod-env:
    runs-on: ubuntu-latest

    steps:
      - name: Write PROD_ENV to server
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          debug: true
          script: |
            # Write PROD_ENV secret to server
            echo "${{ secrets.PROD_ENV }}" > /home/youruser/prod.env

            # Verify: read file from server
            echo "=== PROD_ENV content on server ==="
            cat /home/youruser/prod.env
