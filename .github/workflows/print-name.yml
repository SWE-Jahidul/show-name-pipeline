name: Write & Read PROD_ENV

on:
  push:
    branches:
      - main       # main branch এ push হলে auto run
  workflow_dispatch:   # manual trigger-ও থাকবে

jobs:
  prod-env:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ SSH → write PROD_ENV to server and read it
      - name: Write & Read PROD_ENV on server
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            # Write PROD_ENV text to a file
            echo "${{ secrets.PROD_ENV }}" > /home/${{ secrets.USER }}/prod_env.txt
            chmod 600 /home/${{ secrets.USER }}/prod_env.txt

            # Read the file and echo value
            PROD_ENV_VALUE=$(cat /home/${{ secrets.USER }}/prod_env.txt)
            echo "✅ PROD_ENV on server: $PROD_ENV_VALUE"
